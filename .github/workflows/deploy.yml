name: c1b-deploy
on: { push: { branches: [main] } }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - name: Install deps
      run: pip install -r backend/requirements.txt
    - name: Build ML artifacts (frozen LightGBM pkl + thresholds + Phase 1/3/4 CSVs)
      run: cd backend && python ml/build_artifacts.py
    - name: Run full pytest suite with coverage
      working-directory: backend
      run: pytest tests/ --cov=. -v --tb=short
    - name: Deploy regression guard — verify Prometheus=multiproc startup line
      working-directory: backend
      run: pytest tests/test_startup_log.py::test_startup_log_multiproc_mode -v --tb=short

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build -t ${{ secrets.DOCKER_REGISTRY }}/c1b-backend:${{ github.sha }} ./backend
    - run: docker build -t ${{ secrets.DOCKER_REGISTRY }}/c1b-frontend:${{ github.sha }} ./frontend
    - run: docker push ${{ secrets.DOCKER_REGISTRY }}/c1b-backend:${{ github.sha }}
    - run: docker push ${{ secrets.DOCKER_REGISTRY }}/c1b-frontend:${{ github.sha }}
    - run: kubectl apply -f k8s/
    - name: Post-deploy verification — startup log must say Prometheus=multiproc
      run: |
        kubectl rollout status deployment/c1b-backend --timeout=120s
        # Wait for a fresh pod to emit its lifespan startup line
        sleep 8
        POD=$(kubectl get pods -l app=c1b-backend -o jsonpath='{.items[0].metadata.name}')
        LOGS=$(kubectl logs "$POD")
        if ! echo "$LOGS" | grep -q "Prometheus=multiproc"; then
          echo "::error::DEPLOY REGRESSION: Prometheus=multiproc not found in pod logs"
          echo "Tail of logs:"
          echo "$LOGS" | tail -50
          exit 1
        fi
        echo "✅ Prometheus=multiproc confirmed in pod $POD"
